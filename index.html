<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" 
  type="image/png" 
  sizes="32x32" 
  href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Product preview card component</title>

  <style>
  .attribution { font-size: 0.6875rem; text-align: center; }
  .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  
</head>
  <body>
    
    <section class="card">

      <div class="image">
        <img
            src="./images/image-product-desktop.jpg"
            alt="Gabrielle Perfume"/>
      </div>


        <section class="content">
          
            <p class="category">PERFUME</p>
            <h1>Gabrielle Essence Eau De Parfum</h1>
            
            <p class="description">A floral, solar and voluptuous interpretation composed by
              Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

            <div class="price">
              <h2>$149.99</h2>
              <p>$169.99</p>
            </div>

            <div class="button">
              <img src="./images/icon-cart.svg" alt="cart icon"/>
              <p>Add to Cart</p>
            </div>

        </section>

    </section>

  </body>
</html>
